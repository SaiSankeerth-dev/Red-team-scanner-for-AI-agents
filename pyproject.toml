[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-agent-scanner"
version = "0.1.0"
description = "Automated red-team scanner for AI agents: 10 probe families, deterministic verdicts, scored reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sai Sankeerth Voorugonda" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pillow>=10.0"]

[project.scripts]
redline = "redline.cli:main"

[project.urls]
Homepage = "https://github.com/SaiSankeerth-dev/Red-team-scanner-for-AI-agents"

[tool.setuptools.packages.find]
include = ["redline*"]
